; Web elements kept OUTSIDE the test scripts (Framework step 5: properties file)
; Format:  name = locator_type : locator_value
; locator_type is one of: id, name, xpath, css, link, partial_link, class, tag

[login]
username        = id:UserName
password        = id:Password
remember_me     = id:RememberMe
remember_label  = xpath://label[@for='RememberMe']
sign_in         = id:btnLogin
forgot_password = link:Forgot Password
admin_login     = link:Admin Login
username_error  = xpath://*[text()='Please enter email or mobile no.']
password_error  = xpath://*[text()='Please enter password.']

[home]
logout          = link:Logout
employee_menu   = link:Employee
create_link     = css:.main-sidebar a[href='/Employee/Create']
search_link     = css:.main-sidebar a[href='/Employee/Search']
more_menu       = link:More
settings_menu   = link:Settings
sidebar         = class:main-sidebar

[employee_create]
first_name      = id:FirstName
last_name       = id:LastName
email           = id:EmailId
mobile          = id:MobileNo
dob             = id:DOB
male            = id:rdbMale
female          = id:rdbFemale
address         = id:Address
country         = id:CountryId
city            = id:CityId
other_city_chk  = xpath://label[@for='chkOtherCity']
other_city      = id:OtherCity
skills          = css:input.chkSkill
save            = xpath://button[normalize-space()='Save']
cancel          = xpath://a[normalize-space()='Cancel']
field_errors    = css:span.field-validation-error

[employee_search]
name            = id:Name
mobile          = id:MobileNo
search          = id:btnSearch
clear           = id:btnClear
add_employee    = link:Add Employee
rows            = xpath://table[@id='tblEmployee']/tbody/tr
first_cells     = xpath://table[@id='tblEmployee']/tbody/tr/td[1]
headers         = xpath://table[@id='tblEmployee']/thead/tr/th
total_pages     = id:spanTotalPages_EmployeeGrid
next_page       = xpath:(//a[normalize-space()='Next'])[1]
page_number     = xpath:(//input[@id='txtPageNumber_EmployeeGrid'])[1]
