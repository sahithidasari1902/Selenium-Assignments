# pytest settings (plays the role of testng.xml)
[pytest]
testpaths = tests
addopts = -v --html=reports/report.html --self-contained-html
markers =
    smoke: quick, most important tests (TestNG group "smoke")
    regression: full regression tests (TestNG group "regression")
    login: login module
    employee: employee module
    more: More menu pages
    demo: pytest features that match TestNG features
log_cli = true
log_cli_level = INFO
log_file = logs/test_run.log
log_file_level = INFO
log_file_format = %(asctime)s %(levelname)s %(name)s - %(message)s
